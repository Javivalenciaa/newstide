name: Pipeline Tests

on:
  push:
    paths:
      - 'pipeline/**'
      - '.github/workflows/pipeline-tests.yml'
  pull_request:
    paths:
      - 'pipeline/**'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pipeline/requirements-dev.txt

      - name: Run tests
        run: pytest
        working-directory: pipeline
