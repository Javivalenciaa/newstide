name: NewsTide Finance Pipeline

on:
  schedule:
    # 13:35 UTC daily — distinct from tech pipeline (06:00 UTC)
    # Morning for US East Coast (9:35 AM ET), avoids identical publish patterns
    - cron: '35 13 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run finance pipeline
        run: python pipeline/finance_pipeline.py
        env:
          SERPAPI_KEY:          ${{ secrets.SERPAPI_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSPLASH_ACCESS_KEY:  ${{ secrets.UNSPLASH_ACCESS_KEY }}
