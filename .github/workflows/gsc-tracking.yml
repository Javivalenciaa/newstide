name: NewsTide GSC Tracking

on:
  schedule:
    # Off :00 — see daily.yml for why (top-of-hour is GitHub's most congested
    # minute for schedule triggers, causing multi-hour delays).
    - cron: '22 8 * * *'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Días a recuperar hacia atrás (1 = solo el día habitual; 90 = backfill histórico)'
        required: false
        default: '1'

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run GSC tracking
        run: python pipeline/gsc_tracking.py
        env:
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:     ${{ secrets.SUPABASE_SERVICE_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL:             ${{ secrets.GSC_SITE_URL }}
          # Scheduled runs stay incremental (1 day). Only a manual dispatch
          # can request a backfill.
          GSC_BACKFILL_DAYS:        ${{ github.event.inputs.backfill_days || '1' }}
