name: YepAPI Smoke Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run YepAPI smoke test (1 keyword, no articles, no other API calls)
        run: python pipeline/dataforseo_smoke_test.py
        env:
          YEPAPI_API_KEY: ${{ secrets.YEPAPI_API_KEY }}
