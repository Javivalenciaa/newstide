name: IndexNow — Static SEO/AEO/GEO URLs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Submit static URLs to IndexNow
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, sys

          KEY = "964bf589528b466cace60749e05cfcb6"

          payload = {
              "host": "www.newstide.news",
              "key": KEY,
              "keyLocation": f"https://www.newstide.news/{KEY}.txt",
              "urlList": [
                  "https://www.newstide.news/llms.txt",
                  "https://www.newstide.news/llms-full.txt",
                  "https://www.newstide.news/favicon.ico",
                  "https://www.newstide.news/robots.txt",
                  "https://www.newstide.news/sitemap.xml",
                  "https://www.newstide.news/news-sitemap.xml",
                  "https://www.newstide.news/sitemap-complete.xml",
                  "https://www.newstide.news/rss.xml",
                  "https://www.newstide.news/en/rss.xml",
                  "https://www.newstide.news/",
                  "https://www.newstide.news/sobre-nosotros",
                  "https://www.newstide.news/autores/javier-valencia",
                  "https://www.newstide.news/politica-editorial",
                  "https://www.newstide.news/en/editorial-policy",
                  "https://www.newstide.news/privacidad",
                  "https://www.newstide.news/terminos-de-uso",
                  "https://www.newstide.news/contacto"
              ]
          }

          body = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              "https://api.indexnow.org/IndexNow",
              data=body,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  status = resp.status
                  body_resp = resp.read().decode()
          except urllib.error.HTTPError as e:
              status = e.code
              body_resp = e.read().decode()

          print(f"IndexNow HTTP: {status}")
          print(f"Body: {body_resp}")
          if status in (200, 202):
              print(f"✅ {len(payload['urlList'])} URLs enviadas OK")
          else:
              print("❌ Fallo")
              sys.exit(1)
          PYEOF
