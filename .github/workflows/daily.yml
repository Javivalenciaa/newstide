name: NewsTide Daily Pipeline

on:
  schedule:
    # Off the top of the hour on purpose — GitHub's own docs warn that
    # schedule triggers get delayed most at :00, when the whole platform's
    # cron jobs queue up at once. Runs from 2026-08-27 to 2026-08-31 at the
    # old '0 6 * * *' fired 5-12 hours late (once not at all by 14:30 CEST).
    - cron: '12 6 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        run: python pipeline/pipeline.py
        env:
          SERPAPI_KEY:          ${{ secrets.SERPAPI_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSPLASH_ACCESS_KEY:  ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL:         ${{ secrets.GSC_SITE_URL }}
          YEPAPI_API_KEY:       ${{ secrets.YEPAPI_API_KEY }}
